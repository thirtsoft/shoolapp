name: CI/CD Frontend MySchool

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22

          script: |
            set -e

            echo "=========================================="
            echo "   DEPLOYMENT MYSCHOOL FRONTEND"
            echo "=========================================="

            cd ~/apps/frontend/eduschool/eduschooldauphin

            echo "==> Pull latest source code"
            git fetch origin
            git reset --hard origin/master

            echo "==> Commit deployed"
            git log -1 --oneline

            echo "==> Validate Docker Compose configuration"
            docker compose config -q

            echo "==> Build frontend image"
            docker compose build myschool_frontend

            echo "==> Start frontend"
            docker compose up -d --wait myschool_frontend

            echo "==> Frontend status"
            docker compose ps myschool_frontend

            echo "==> Cleanup unused Docker images"
            docker image prune -f

            echo "=========================================="
            echo "   FRONTEND DEPLOYMENT COMPLETED"
            echo "=========================================="
