<div class="calendar-card">
  <div class="card-head">
    <div>
      @if (eleveActif(); as eleve) {
        <h2>🗓️ Emploi du temps - {{ eleve.prenom }} {{ eleve.nom }} ({{ eleve.classeEleve }})</h2>
      } @else {
        <h2>🗓️ Emploi du temps</h2>
      }
    </div>
  </div>

  <div class="calendar-container">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>
