<app-generic-table-dossier
  title="Mes Bons de salaires"
  [tableColumns]="columns"
  [tableData]="demandeAvSalaireData"
  [tableSizes]="tableSizes"
  [totalElements]="totalElements"
  [currentPage]="currentPage"
  [pageSize]="pageSize"
  [isLoading]="isLoading"
  [isEditIcon]="isEdit"
  [showSubmitIcon]="true"
  (submitAction)="confirmerSoumission($event)"
  [isLockableIcon]="isLockable"
  (pageChange)="changePage($event)"
  [deleteEndPoint]="deleteEndpoint"
  [showSearch]="false"
  [filtered]="tableFilters"
  (filterChange)="onFilterChange($event.filter, $event.value)"
  [showFilters]="true"
  (resetFilters)="resetFilters()"
  (sizeChange)="changeSize($event)"
  addButtonLink="/enseignant/bon-salaire/create"
  modifierButtonLink="/enseignant/bon-salaire/edit"
>
</app-generic-table-dossier>

@if (showConfirmationModal) {
  <div class="modal-custom-overlay" (click)="annulerSoumission()">
    <div class="modal-custom-container" (click)="$event.stopPropagation()">
      <!-- HEADER -->
      <div class="modal-header-custom">
        <h5 class="modal-title-custom">
          <i class="fas fa-question-circle me-2"></i>
          Confirmer la soumission
        </h5>

        <button type="button" class="btn-close-custom" (click)="annulerSoumission()">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- BODY -->
      <div class="modal-body-custom">
        <p class="modal-message">
          Êtes-vous sûr de vouloir
          <strong class="action-highlight"> soumettre </strong>
          cette demande de bon de salaire ?
        </p>

        @if (demandeAConfirmer) {
          <div class="recap-section">
            <div class="recap-item">
              <span class="recap-label"> Motif </span>

              <span class="recap-value">
                {{ demandeAConfirmer.motif }}
              </span>
            </div>

            <div class="recap-item">
              <span class="recap-label"> Numéro </span>

              <span class="recap-value">
                {{ demandeAConfirmer.numeroDemande }}
              </span>
            </div>
          </div>
        }

        <div class="alert alert-warning mt-3 mb-0">
          <i class="fas fa-exclamation-triangle me-2"></i>

          Après soumission, cette demande ne pourra plus être modifiée.
        </div>
      </div>

      <!-- FOOTER -->
      <div class="modal-footer-custom">
        <button type="button" class="btn-cancel" (click)="annulerSoumission()">
          <i class="fas fa-times me-2"></i>
          Annuler
        </button>

        <button type="button" class="btn-pay" (click)="soumettreConge()">
          <i class="fas fa-check-circle me-2"></i>
          Soumettre
        </button>
      </div>
    </div>
  </div>
}
